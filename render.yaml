# One-click deploy config for Render (render.com).
# 1. Push this repo to GitHub.
# 2. On Render: New → Blueprint → pick this repo. It reads this file.
# 3. Render generates MASTER_KEY + SESSION_SECRET for you and mounts a
#    persistent disk at data/ so your database, keys and uploads survive deploys.
services:
  - type: web
    name: ftech-automation-posts
    runtime: node
    plan: starter            # always-on so the scheduler never sleeps
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MASTER_KEY      # encrypts your API keys — generated once, kept forever
        generateValue: true
      - key: SESSION_SECRET  # signs the login cookie
        generateValue: true
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
